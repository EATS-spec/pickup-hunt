<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Pickup Hunt architecture</title>
  <desc id="desc">The visitor's browser and cloud timer call the app on Sites. The app saves watches, shared jobs, and notifications in D1, queries Apple through a durable request gate, and sends notifications through a browser push service. The device service worker returns a display receipt to the app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#527259"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22362a; text-anchor: middle; }
      .node { fill: #fffdf7; stroke: #9ba99e; stroke-width: 1.5; }
      .app { fill: #e2edd9; stroke: #527259; stroke-width: 2; }
      .label { font-size: 20px; font-weight: 600; }
      .detail { font-size: 17px; }
      .flow { fill: none; stroke: #527259; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .receipt { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="900" height="440" rx="18" fill="#f5f2e9"/>
  <path class="flow" d="M210 78H245V120H280"/>
  <path class="flow" d="M210 208H245V170H280"/>
  <path class="flow" d="M510 125H545V65H580"/>
  <path class="flow" d="M510 175H550V205H580"/>
  <path class="flow" d="M730 250V300"/>
  <path class="flow" d="M395 200V300"/>
  <path class="flow" d="M280 345H210"/>
  <path class="flow receipt" d="M115 300V270H330V200"/>
  <text class="detail" x="207" y="261">Display receipt</text>
  <rect class="node" x="20" y="40" width="190" height="76" rx="12"/>
  <text class="label" x="115" y="85">Visitor's browser</text>
  <rect class="node" x="20" y="170" width="190" height="76" rx="12"/>
  <text class="label" x="115" y="201">Cloud timer</text>
  <text class="detail" x="115" y="226">Five-minute callbacks</text>
  <rect class="app" x="280" y="90" width="230" height="110" rx="14"/>
  <text class="label" x="395" y="137">App + API</text>
  <text class="detail" x="395" y="166">Sites / Worker</text>
  <rect class="node" x="580" y="20" width="300" height="90" rx="12"/>
  <text class="label" x="730" y="57">D1 database</text>
  <text class="detail" x="730" y="84">Watches · shared jobs · outbox</text>
  <rect class="node" x="580" y="160" width="300" height="90" rx="12"/>
  <text class="label" x="730" y="197">Durable request gate</text>
  <text class="detail" x="730" y="224">Minimum gap + backoff</text>
  <rect class="node" x="580" y="300" width="300" height="90" rx="12"/>
  <text class="label" x="730" y="338">Apple pickup</text>
  <text class="label" x="730" y="365">availability</text>
  <rect class="node" x="280" y="300" width="230" height="90" rx="12"/>
  <text class="label" x="395" y="338">Browser push</text>
  <text class="label" x="395" y="365">service</text>
  <rect class="node" x="20" y="300" width="190" height="90" rx="12"/>
  <text class="label" x="115" y="338">Device service</text>
  <text class="label" x="115" y="365">worker</text>
</svg>
