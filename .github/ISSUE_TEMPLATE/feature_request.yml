name: Feature request
description: Suggest a better way to hunt.
title: "Idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the situation or friction you want to improve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: A rough description is enough. Include alternatives you have considered if useful.
    validations:
      required: true
